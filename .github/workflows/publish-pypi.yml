name: Prepare or publish PyPI release

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run never requests production OIDC
        type: choice
        options: [dry-run, publish]
        default: dry-run
        required: true
      source_sha:
        description: Exact 40-character source commit
        type: string
        required: true
      tag:
        description: Existing vVERSION tag, required for publish
        type: string
        required: false

permissions: {}
concurrency:
  group: privacy-gateway-pypi
  cancel-in-progress: false

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      raw_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Validate source input syntax
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build verification tools
        run: python -m pip install -e ".[dev]"
      - name: Build once and smoke-test distributions
        run: python tools/verify_package_build.py --temp-root "$RUNNER_TEMP/release-build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: raw-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-build/pgw-build-normal/dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  verify:
    name: Verify release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      verified_id: ${{ steps.upload.outputs.artifact-id }}
      sums_sha256: ${{ steps.evidence.outputs.sums_sha256 }}
      publish_ready: ${{ steps.evidence.outputs.publish_ready }}
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: policy
          persist-credentials: false
      - name: Checkout source as data only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require immutable artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.raw_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.raw_id }}
          path: raw
          merge-multiple: true
      - name: Verify source, protection and artifacts without executing package
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python -B policy/tools/release_evidence.py
          --policy policy --source source --raw raw
          --output "$RUNNER_TEMP/verified-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: verified-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-release/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  publish:
    name: Publish approved release
    needs: verify
    if: >-
      inputs.mode == 'publish' && github.ref == 'refs/heads/main' &&
      needs.verify.outputs.publish_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/privacy-gateway/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require immutable artifact ID
        env:
          ARTIFACT_ID: ${{ needs.verify.outputs.verified_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.verify.outputs.verified_id }}
          path: release
          merge-multiple: true
      - name: Verify trusted digest and exact transferred file set
        env:
          EXPECTED_SUMS: ${{ needs.verify.outputs.sums_sha256 }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SUMS" =~ ^[0-9a-f]{64}$ ]]
          test -z "$(find release -type l -print)"
          test "$(find release -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)" = "$(printf 'SHA256SUMS\ndist\nmanifest.json')"
          test "$(find release/dist -mindepth 1 | wc -l)" -eq 2
          test "$(find release/dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          printf '%s  release/SHA256SUMS\n' "$EXPECTED_SUMS" | sha256sum --check --strict
          (cd release && sha256sum --check --strict SHA256SUMS)
      - name: Publish with short-lived trusted identity
        id: publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: release/dist/
          skip-existing: false
          attestations: true
      - name: Record action outcome without credentials
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          printf 'Publish action outcome: %s\n' "$PUBLISH_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
