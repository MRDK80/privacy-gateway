name: CI

on:
  push:
    branches:
      - main
      - "roadmap/**"
  pull_request:
    branches:
      - main
      - "roadmap/**"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - name: Настройка Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Установка Bubblewrap для проверки OS scope
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Подготовка приватного cache закреплённых hooks
        if: runner.os == 'Linux'
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pgw-genuine-precommit-${{ strategy.job-index }}
        shell: bash
        run: |
          umask 077
          python - <<'PYSETUP'
          import os
          import stat
          from pathlib import Path

          root = Path(os.environ["PRE_COMMIT_HOME"])
          assert root.is_absolute() and root.parent.resolve(strict=True) == root.parent
          root.mkdir(mode=0o700, exist_ok=False)
          info = root.lstat()
          assert stat.S_ISDIR(info.st_mode) and not root.is_symlink()
          assert info.st_uid == os.geteuid()
          assert stat.S_IMODE(info.st_mode) == 0o700
          PYSETUP
          timeout --signal=TERM --kill-after=10s 300s pre-commit install-hooks

      - name: Запуск тестов
        env:
          PRE_COMMIT_HOME: ${{ runner.temp }}/pgw-genuine-precommit-${{ strategy.job-index }}
        run: pytest

      - name: Проверка линтером ruff
        run: ruff check .

      - name: Статическая типизация mypy
        run: mypy .

      - name: Проверка secret-drift без мутации baseline
        run: python tools/check_secrets_baseline.py --temp-root "${{ runner.temp }}"

      - name: Сборка дистрибутива и сверка версии
        run: python tools/verify_package_build.py --temp-root "${{ runner.temp }}"

      - name: Нижняя граница setuptools 77.0.3
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: >-
          python tools/verify_package_build.py
          --temp-root "${{ runner.temp }}"
          --setuptools-pin 77.0.3
