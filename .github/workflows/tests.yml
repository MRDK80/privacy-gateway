name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Настройка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Запуск тестов
        run: pytest

      - name: Проверка линтером ruff
        run: ruff check .

      - name: Статическая типизация mypy
        run: mypy src

      - name: Сканирование секретов (detect-secrets)
        # Запуск без baseline-файла; код выхода 0 означает отсутствие находок.
        # detect-secrets завершается с ненулевым кодом только при обнаружении
        # НОВОГО секрета относительно baseline. На проекте без baseline-файла
        # сканирование завершится с кодом 0, если находок нет.
        run: |
          detect-secrets scan --all-files --exclude-files '(\.git/.*|\.venv/.*|\.mypy_cache/.*|\.pytest_cache/.*|\.ruff_cache/.*|.*\.egg-info/.*)' > /dev/null
          echo "Сканирование detect-secrets завершено без находок."
