name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - name: Настройка Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Запуск тестов
        run: pytest

      - name: Проверка линтером ruff
        run: ruff check .

      - name: Статическая типизация mypy
        run: mypy .

      - name: Проверка secret-drift без мутации baseline
        run: python tools/check_secrets_baseline.py --temp-root "${{ runner.temp }}"

      - name: Сборка дистрибутива и сверка версии
        run: python tools/verify_package_build.py --temp-root "${{ runner.temp }}"

      - name: Нижняя граница setuptools 70.1
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: >-
          python tools/verify_package_build.py
          --temp-root "${{ runner.temp }}"
          --setuptools-pin 70.1.0
