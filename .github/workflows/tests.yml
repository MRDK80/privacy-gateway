name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Настройка Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Запуск тестов
        run: pytest

      - name: Проверка линтером ruff
        run: ruff check .

      - name: Статическая типизация mypy
        run: mypy src

      - name: Сканирование секретов (detect-secrets) — Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          detect-secrets scan --all-files --exclude-files '(\.git/.*|\.venv/.*|\.mypy_cache/.*|\.pytest_cache/.*|\.ruff_cache/.*|.*\.egg-info/.*)' > /dev/null
          echo "Сканирование detect-secrets завершено без находок."

      - name: Сканирование секретов (detect-secrets) — Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          detect-secrets scan --all-files --exclude-files "(\.git/.*|\.venv/.*|\.mypy_cache/.*|\.pytest_cache/.*|\.ruff_cache/.*|.*\.egg-info/.*)" | Out-Null
          Write-Host "Сканирование detect-secrets завершено без находок."
