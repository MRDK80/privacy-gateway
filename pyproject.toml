[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-gateway"
version = "0.3.0"
description = "Локальный инструмент для безопасной подготовки корпоративных текстов перед ручной передачей во внешнюю языковую модель."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Mikhail Iofik"}
]
readme = "README.md"
keywords = ["privacy", "llm", "pii", "anonymization", "tokenization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = [
  "cryptography>=42",
  "keyring>=25",
  "PyYAML>=6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "detect-secrets>=1.5",
    "types-PyYAML",
]

[project.urls]
Repository = "https://github.com/MRDK80/privacy-gateway"

[project.scripts]
pgw = "privacy_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
privacy_gateway = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 88
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["privacy_gateway"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
