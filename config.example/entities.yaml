# entities.yaml — конфигурация обнаружения сущностей.
# Этап Э2: regex-детекторы и синтетические словари включены.
# НЕ добавляйте реальные имена, организации, домены, IP или инфраструктурные данные.

# Типы сущностей, включённые для regex-детекции.
# Если список пуст или отсутствует — включаются все поддерживаемые regex-детекторы.
enabled_regex_types:
  - EMAIL
  - PHONE
  - HOST
  - ENDPOINT
  - RESOURCE
  - DATE
  - AMOUNT

# Синтетические словари для детектирования по точному вхождению.
# Все значения ОБЯЗАНЫ быть вымышленными и не содержать реальных данных.
dictionary:
  PERSON:
    - "Синтетический Иванов"
    - "Вымышленный Петров"
    - "Тестовый Сидоров"
  ORG:
    - "ООО Северный Маяк"
    - "АО Тестовая Компания"
    - "ПАО Синтетик Груп"
  SYSTEM:
    - "Система-Альфа"
    - "Платформа-Бета"
    - "Сервис-Гамма"
  PROJECT:
    - "Проект-Орион"
    - "Проект-Зенит"
    - "ALPHA-001"
  DEPARTMENT:
    - "Отдел Тестирования"
    - "Служба Контроля"
    - "Управление Синтеза"
  ROLE:
    - "Руководитель группы"
    - "Технический директор"
    - "Аналитик данных"
  ENVIRONMENT:
    - "prod-synthetic"
    - "staging-test"
    - "dev-local"

# Таблица приоритетов перекрытий (документация, не исполняемая логика).
# Реализация — в detector.py :: _TYPE_PRIORITY / _SECRET_KIND_PRIORITY.
#
# Приоритет  Тип
# 0          PRIVATE_KEY, CONNECTION_STRING, API_TOKEN, PASSWORD  (наивысший)
# 1          ENDPOINT
# 2          EMAIL
# 3          RESOURCE
# 4          HOST
# 5          PHONE
# 6          AMOUNT
# 7          DATE
# 8          словарные сущности (наименьший)
#
# При равном приоритете выбирается более длинное совпадение.
# При равной длине — совпадение с меньшим start.
# Дубликаты на одинаковой позиции не создаются.
