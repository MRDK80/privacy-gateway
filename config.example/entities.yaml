# entities.yaml — пример конфигурации обнаружения сущностей.
# Этап Э1: только структура; обнаружение НЕ реализовано.
# Не добавляйте реальные имена, организации, домены, IP или инфраструктурные данные.

entity_types:
  - id: PERSON
    description: "Физическое лицо (полное имя, имя, фамилия)"
    enabled: false  # будет включено в Э2+

  - id: ROLE
    description: "Должность или организационная роль"
    enabled: false

  - id: ORG
    description: "Юридическое лицо или название организации"
    enabled: false

  - id: DEPARTMENT
    description: "Внутреннее подразделение или отдел"
    enabled: false

  - id: EMAIL
    description: "Адрес электронной почты"
    enabled: false

  - id: PHONE
    description: "Номер телефона в любом формате"
    enabled: false

  - id: HOST
    description: "Имя хоста или сервера"
    enabled: false

  - id: ENDPOINT
    description: "URL, URI или сетевой эндпоинт"
    enabled: false

  - id: RESOURCE
    description: "Путь в файловой системе или ресурс хранилища"
    enabled: false

  - id: SYSTEM
    description: "Внутренняя система или приложение"
    enabled: false

  - id: PROJECT
    description: "Внутреннее название или код проекта"
    enabled: false

  - id: AMOUNT
    description: "Денежная сумма или финансовый показатель"
    enabled: false

  - id: METRIC
    description: "KPI или значение метрики производительности"
    enabled: false

  - id: DOCUMENT
    description: "Идентификатор документа, номер договора или код ссылки"
    enabled: false

  - id: DATE
    description: "Конкретная дата или диапазон дат"
    enabled: false

  - id: DURATION
    description: "Период времени или продолжительность"
    enabled: false

  - id: ENVIRONMENT
    description: "Метка среды развёртывания (например: prod, staging)"
    enabled: false

# local_dictionary: будущий файл переопределений для конкретного кейса, НЕ коммитится в Git.
# Пример структуры (синтетический, только для иллюстрации):
#
# local_dictionary:
#   PERSON:
#     - "Синтетическое Имя Один"
#     - "Синтетическое Имя Два"
#   PROJECT:
#     - "SYNTH-PROJECT-ALPHA"
