# safety.yaml — конфигурация проверок безопасности.
# Этап Э2: добавлен параметр max_input_bytes.

# Максимальный размер входного текста в байтах.
# Консервативный лимит 512 КБ (524 288 байт).
# Применяется в input_parser.read_input().
max_input_bytes: 524288

statuses:
  READY:
    description: "Текст прошёл все проверки безопасности; безопасно передавать модели."
  REVIEW:
    description: "Текст требует ручной проверки перед передачей."
  BLOCKED:
    description: "Текст содержит данные высокого риска; передача запрещена."

check_categories:
  - id: secret_leak
    description: "Обнаруживает возможные секреты, токены, пароли и API-ключи."
    status_on_trigger: BLOCKED
    enabled: false

  - id: unresolved_entity
    description: "Обнаруживает паттерны, похожие на сущности, которые не были токенизированы."
    status_on_trigger: REVIEW
    enabled: false

  - id: token_integrity
    description: "Проверяет корректность формата всех токенов и их наличие в карте кейса."
    status_on_trigger: BLOCKED
    enabled: false

  - id: unsupported_attachment
    description: "Помечает нетекстовые типы содержимого, которые нельзя безопасно обработать."
    status_on_trigger: BLOCKED
    enabled: false

  - id: output_length
    description: "Предупреждает, если обезличенный текст превышает рекомендуемый размер prompt."
    status_on_trigger: REVIEW
    enabled: false

# Статусы READY / REVIEW / BLOCKED не реализованы как рабочая логика на Э2.
# Все check_categories остаются отключёнными до Э3+.
