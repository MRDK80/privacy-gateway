# routing.yaml — конфигурация маршрутизации Privacy Gateway, формат Э6.
# Секреты всегда блокируются независимо от этого файла (fail closed).

output_dir: "./pgw_out"
overwrite: false

rules:
  tokenize:
    - EMAIL
    - PHONE
    - HOST
    - ENDPOINT
    - RESOURCE
    - DATE
    - AMOUNT
    - PERSON
    - ORG
    - SYSTEM
    - PROJECT
    - DEPARTMENT
    - ROLE
    - ENVIRONMENT

  block_unconditionally: []
