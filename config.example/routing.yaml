# routing.yaml — пример конфигурации маршрутизации по каналам.
# Этап Э1: только структура; логика маршрутизации НЕ реализована.
# Ключевые слова ниже синтетические и приведены только для иллюстрации.

channels:
  - id: "01"
    name: "Интеграция и границы ответственности"
    description: "Вопросы системной интеграции, границ владения и точек передачи."
    keywords_synthetic:
      - интеграция
      - граница
      - ответственность
      - передача
      - интерфейс
    enabled: false

  - id: "02"
    name: "Безопасная деловая переписка"
    description: "Составление и проверка безопасной деловой корреспонденции."
    keywords_synthetic:
      - переписка
      - письмо
      - ответ
      - согласование
      - подтверждение
    enabled: false

  - id: "03"
    name: "Портфель коммерческих инициатив"
    description: "Анализ и приоритизация портфеля коммерческих инициатив."
    keywords_synthetic:
      - инициатива
      - портфель
      - оценка
      - коммерческий
      - воронка
    enabled: false

  - id: "04"
    name: "Реестр решений и ограничений"
    description: "Журнал решений, реестр ограничений и управление ADR."
    keywords_synthetic:
      - решение
      - ограничение
      - adr
      - обоснование
      - компромисс
    enabled: false

  - id: "05"
    name: "Инвентаризация технических зависимостей"
    description: "Инвентаризация технических зависимостей и управление версиями."
    keywords_synthetic:
      - зависимость
      - версия
      - библиотека
      - инвентаризация
      - совместимость
    enabled: false

# Будущее: правила маршрутизации будут сопоставлять обнаруженные типы сущностей
# и ключевые слова с наиболее подходящим каналом. В Э1 автоматической маршрутизации нет.
